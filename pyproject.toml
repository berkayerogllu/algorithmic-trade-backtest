[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithmic-backtest"
version = "0.1.0"
description = "Educational algorithmic trading and backtesting simulator"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pandas>=2.0",
    "yfinance>=0.2.50",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["algorithmic_backtest*"]

