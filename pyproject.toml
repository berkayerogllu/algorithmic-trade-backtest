[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithmic-backtest"
version = "0.1.0"
description = "Educational algorithmic trading and backtesting simulator"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.22",
    "pandas>=2.0",
    "yfinance>=0.2.50",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

